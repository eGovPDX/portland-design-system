# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Input
description: A native HTML input with Portland Design System styling.
status: experimental

props:
  type: object
  required:
    - type
  properties:
    type:
      type: string
      title: Input type
      enum:
        - text
        - email
        - password
        - search
        - tel
        - url

    state:
      type: string
      title: Input state
      description: Visual state of the input
      enum:
        - error
        - disabled

    name:
      type: string
      required: true

    id:
      type: string
      required: true

    value:
      type: string

    placeholder:
      type: string

    required:
      type: boolean
      default: false

    disabled:
      type: boolean
      default: false

    readonly:
      type: boolean
      default: false

    autoComplete:
      type: string

    minlength:
      type: integer

    maxlength:
      type: integer

    pattern:
      type: string

    accept:
      type: string

slots:
  addons:
    description: Slot for control-addon components to be displayed along with the input field.
  after:
    description: Slot after the control wrapper
  before:
    description: Slot prior to the control wrapper
  content:
    description: Slot for content inside the control wrapper.
