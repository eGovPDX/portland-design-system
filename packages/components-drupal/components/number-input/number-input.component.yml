$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Number input
description: A native number input with Portland Design System styling.
status: experimental

props:
  type: object
  properties:
    state:
      type: string
      title: Input state
      description: Visual state of the input
      enum:
        - error
        - disabled

    name:
      type: string
      required: true

    id:
      type: string
      required: true

    value:
      type:
        - string
        - number

    placeholder:
      type: string

    required:
      type: boolean
      default: false

    disabled:
      type: boolean
      default: false

    min:
      type: number

    max:
      type: number

    step:
      type:
        - string
        - number

    list:
      type: string
      title: Datalist id
      description: The id of a datalist element that provides suggested values.

slots:
  content:
    description: Slot for additional content inside the input wrapper.
