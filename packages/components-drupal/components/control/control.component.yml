# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Control
description: A base form control with shared attributes and wrapper slots, but no field markup.
status: experimental

props:
  type: object
  properties:
    wrapper_element:
      type: string
      default: span

    wrapper_attributes:
      type: Drupal\Core\Template\Attribute

    input_attributes:
      type: Drupal\Core\Template\Attribute

    state:
      type: string
      enum:
        - error
        - disabled

    name:
      type: string

    id:
      type: string

    placeholder:
      type: string

    required:
      type: boolean
      default: false

    disabled:
      type: boolean
      default: false

    readOnly:
      type: boolean
      default: false

    autoComplete:
      type: string

    autoFocus:
      type: boolean

slots:
  before:
    description: Slot prior to the control wrapper.
  content:
    description: Empty by default; override this block to render a field using input_attributes.
  addons:
    description: Slot for addons inside the control wrapper, after the field.
  after:
    description: Slot after the control wrapper.
