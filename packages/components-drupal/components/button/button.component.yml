# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Button

# A longer description.
description: |
  A native Twig button component that draws attention to important actions with a large selectable surface.
  Server-side rendered implementation matching the Portland Design System button styles.

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: experimental

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  # Props are always an object with keys. Each key is a variable in your
  # component template.
  type: object

  properties:
    as:
      type: string
      title: Render element
      description: HTML element to render as
      default: button
      enum:
        - button
        - a

    color:
      type: string
      title: Button color
      description: Color scheme for background and content colors
      default: inverse
      enum:
        - default
        - inverse
        - primary
        - secondary
        - success
        - danger
        - warning
        - info
        - disabled
        - fixed

    variant:
      type: string
      title: Button variant
      description: Color variation within the chosen color scheme
      default: subtle
      enum:
        - subtle
        - moderate
        - emphasis
        - strong
        - light
        - dark

    size:
      type: string
      title: Button size
      description: Size of the button using spacing scale
      default: md
      enum:
        - 3xs
        - 2xs
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - 4xl
        - 5xl

    outline:
      type: boolean
      title: Outline style
      description: Whether the button should have an outline style
      default: false

    type:
      type: string
      title: Button type
      description: The HTML button type attribute for button elements
      default: button
      enum:
        - button
        - submit
        - reset

    href:
      type: string
      title: Link URL
      description: URL to use when rendering as an anchor element
      examples:
        - "#"

    disabled:
      type: boolean
      title: Disabled state
      description: Whether the button is disabled
      default: false

slots:
  button_content:
    title: Content
    description: The main content of the button.
