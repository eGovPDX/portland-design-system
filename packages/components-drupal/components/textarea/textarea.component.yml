# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Textarea
description: A native HTML textarea with Portland Design System styling.
status: experimental

props:
  type: object
  required:
    - type
  properties:
    state:
      type: string
      title: Input state
      description: Visual state of the input
      enum:
        - error
        - disabled

    name:
      type: string
      required: true

    id:
      type: string
      required: true

    value:
      type: string

    placeholder:
      type: string

    required:
      type: boolean
      default: false

    disabled:
      type: boolean
      default: false

    readOnly:
      type: boolean
      default: false

    autoCorrect:
      type: boolean

    autoCapitalize:
      type: string
      enum:
        - none
        - sentences
        - words
        - characters

    autocomplete:
      type: string

    minLength:
      type: integer

    maxLength:
      type: integer

    characterCount:
      type: boolean

    cols:
      type: integer

    rows:
      type: integer

    spellCheck:
      type: string
      enum:
        - "true"
        - "false"
        - default

    wrap:
      type: string
      enum:
        - hard
        - soft

slots:
  content:
    description: Slot for additional content inside the input wrapper.
  prefix:
    description: Slot for content to be displayed before the input field.
  suffix:
    description: Slot for content to be displayed after the input field.

libraryOverrides:
  dependencies:
    - core/drupal
    - core/components.portland_components--input
    - core/once
  js:
    textarea.js:
      attributes:
        type: module
